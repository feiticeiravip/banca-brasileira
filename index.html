<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Banca Brasileira</title>

    <meta name="description" content="Banca Brasileira é uma plataforma completa de apostas e cassino online. Acesse o app oficial com segurança, rapidez e suporte via WhatsApp.">
    <meta name="keywords" content="banca brasileira, banca brasileira bet, cassino online, apostas online, jogos online">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/webp" href="icon.webp">

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            font-family: Arial, Helvetica, sans-serif;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
        }

        footer {
            height: 70px;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
        }

        .footer-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .footer-btn:hover {
            background: #00ff88;
            color: #000;
        }

        .footer-btn img {
            height: 28px;
        }

        /* Popup */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup {
            position: relative;
            text-align: center;
        }

        .popup img {
            max-width: 90vw;
            max-height: 70vh;
            cursor: pointer;
        }

        .close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background: red;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-btn {
            margin-top: 12px;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .access-btn:hover {
            background: #00cc6e;
        }
    </style>
</head>

<body>

<iframe
    src="https://app.bancabrasileira.com.br/pr/UBmDxM8X"
    allow="clipboard-read; clipboard-write; fullscreen; payment; geolocation; microphone; camera"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-top-navigation">
</iframe>

<footer>
    <a class="footer-btn" href="https://wa.me/5583993370071?text=Suporte,%20preciso%20de%20ajuda%20na%20banca%20brasileira!" target="_blank">
        📱 Suporte
    </a>

    <a class="footer-btn" href="https://app.bancabrasileira.com.br/pr/UBmDxM8X" target="_blank">
        🎰 Cassino
    </a>

    <a class="footer-btn" href="https://tigerclub.com.br" target="_blank">
        <img src="tiger.webp" alt="Tiger Club">
        <span>Banca Parceira</span>
    </a>
</footer>

<!-- Popup -->
<div class="popup-overlay" id="popup">
    <div class="popup">
        <div class="close-btn" onclick="closePopup()">X</div>

        <a href="https://app.sorteclub.com/pr/Wqz0l6Qw" target="_blank">
            <img src="bancaparceira.webp" alt="Acessar App">
        </a>

        <br>

        <a href="https://app.sorteclub.com/pr/Wqz0l6Qw" target="_blank">
            <button class="access-btn">ACESSAR APP</button>
        </a>
    </div>
</div>

<script>
    setTimeout(() => {
        document.getElementById("popup").style.display = "flex";
    }, 10000);

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }
</script>

</body>
</html>
