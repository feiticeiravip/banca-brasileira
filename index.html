<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Banca Brasileira</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/webp" href="icon.webp">

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            font-family: Arial, Helvetica, sans-serif;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
        }

        footer {
            height: 70px;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
            flex-wrap: wrap;
        }

        .footer-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 10px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }

        .footer-btn:hover {
            background: #00ff88;
            color: #000;
        }

        .footer-btn img {
            height: 20px;
        }

        /* Popup */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup {
            background: #111;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            max-width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: red;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-btn {
            margin-top: 15px;
            padding: 12px 22px;
            font-size: 15px;
            font-weight: bold;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .access-btn:hover {
            background: #00cc6e;
        }
    </style>
</head>

<body>

<iframe
    src="https://app.bancabrasileira.com.br/pr/UBmDxM8X"
    allow="clipboard-read; clipboard-write; fullscreen"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-top-navigation">
</iframe>

<footer>
    <a class="footer-btn" href="https://wa.me/5583993370071?text=Suporte,%20preciso%20de%20ajuda!" target="_blank">
        📱 Suporte
    </a>

    <a class="footer-btn" href="https://app.bancabrasileira.com.br/pr/UBmDxM8X" target="_blank">
        🎰 Cassino
    </a>

    <a class="footer-btn" href="https://tigerclub.com.br" target="_blank">
        🐯 Tiger Club
    </a>

    <a class="footer-btn" href="https://app.sorteclub.com/pr/uLjK7Sh8" target="_blank">
        🍀 Sorte Club
    </a>

    <div class="footer-btn" onclick="openPopup()">
        💼 Promotoria
    </div>
</footer>

<!-- Popup Promotoria -->
<div class="popup-overlay" id="popup">
    <div class="popup">
        <div class="close-btn" onclick="closePopup()">X</div>

        <h2>Venha trabalhar com a gente!</h2>
        <p>Clique abaixo e se torne um promotor agora mesmo.</p>

        <a href="https://wa.me/5583993370071?text=Eu%20quero%20me%20tornar%20promotor!" target="_blank">
            <button class="access-btn">Afiliar-se</button>
        </a>
    </div>
</div>

<script>
    setTimeout(() => {
        document.getElementById("popup").style.display = "flex";
    }, 10000);

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }

    function openPopup() {
        document.getElementById("popup").style.display = "flex";
    }
</script>

</body>
</html>
