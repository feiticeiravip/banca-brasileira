name: Gerar Palpite Diário

on:
  schedule:
    - cron: "0 03 * * *" # Roda todo dia às 00:00 Brasil (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-palpite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Gerar Palpite
        run: node scripts/generate_palpite.js

      - name: Commit e Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add index.html
          git commit -m "Atualização automática de palpites" || echo "Sem mudanças para commit"
          git push
