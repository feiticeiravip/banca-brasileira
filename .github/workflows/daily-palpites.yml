name: Gerar Palpite Diário

on:
  schedule:
    # Roda todo dia às 08:00 UTC -> 05:00 America/Fortaleza (UTC-3)
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  gerar-palpite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          npm ci || true

      - name: Gerar palpite e commitar
        run: |
          node scripts/generate_palpite.js

      - name: Commit e push (se houver mudanças)
        run: |
          git config --global user.email "bot@feiticeiravip"
          git config --global user.name "Palpite Bot"
          git add palpites || true
          git commit -m "Palpite automático: $(date -u +%Y-%m-%d) || GitHub Actions" || echo "Sem alterações"
          git push origin HEAD:main
